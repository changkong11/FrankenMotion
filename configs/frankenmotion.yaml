# @package __global__

data:
  _target_: src.data.text_motion.TextMotionDataset_Part

  name: ${dataset}

  split: train
  min_seconds: 1.0
  max_seconds: 20.0
  preload: true
  tiny: false
  # dropping data
  drop_motion_perc: 0
  drop_cond: 0.1
  drop_trans: 0
  condition: t2m
  annotation: annotations.json

diffusion:
  _target_: src.model.gaussian.GaussianDiffusion
  g_text: True
  loss_type: WeightedMSE
  part_preserve_loss_weight: 0.0
  part_preserve_motion_featsname: ${motion_features}
  # Optional LG-FM auxiliary losses. Keep 0.0 to preserve the original baseline.
  # Suggested first sweep: part_align_loss_weight=0.05/0.1,
  # transition_loss_weight=0.01/0.02.
  part_align_loss_weight: 0.0
  part_align_temperature: 0.07
  transition_loss_weight: 0.0
  transition_loss_type: l1
  # Four coordination losses. Use only with the dynamic graph and state node enabled.
  relation_affinity_loss_weight: 0.0
  relation_smoothness_loss_weight: 0.0
  contact_state_loss_weight: 0.0
  balance_state_loss_weight: 0.0
  coordination_fps: ${data.motion_loader.fps}
  # Apply graph/state supervision only while the motion input remains in the
  # low-noise part of the diffusion trajectory. Zero retains legacy behavior.
  coordination_loss_max_timestep_ratio: 0.0
  state_loss_warmup_epochs: 0
  state_loss_max_scale: 1.0
  # Optional checkpoint-migration period for changing dynamic graph routing.
  dynamic_relation_transition_epochs: 0
  graph_lr_scale: 1.0
  lr_warmup_epochs: 0
  lr_min_scale: 1.0
  # Opt-in stability controls for state-graph training.
  coordination_loss_warmup_epochs: 0
  divergence_guard_ratio: 0.0
  divergence_guard_min_observations: 100
  divergence_guard_max_finite_spikes: 1
  divergence_guard_window_batches: 0
  divergence_guard_skip_finite_spikes: false
  divergence_guard_component_ratio: 0.0
  divergence_guard_max_grad_norm: 0.0
  # Stop at the first invalid model output or loss instead of saving a corrupt run.
  fail_on_nonfinite: true

  denoiser:
    _target_: src.model.backbones.frankenmotion.LGTransformerDenoiser
    nfeats: 613
    tx_dim: ${data.text_encoder.nfeats}
    latent_dim: 512
    motion_nfeats: ${data.motion_loader.nfeats}
    text_part_dim: ${data.text_encoder.pca}
    text_part_names: ["action", "trajectory", "spine", "head", "left_arm", "right_arm", "left_leg", "right_leg"]
    motion_part_names: ["trajectory", "spine", "head", "left_arm", "right_arm", "left_leg", "right_leg"]
    motion_featsname: ${motion_features}
    ff_size: 2048
    num_layers: 4
    local_layers: 2
    global_layers: 2
    num_heads: 8
    dropout: 0.1
    activation: gelu
    use_local_branch: true
    use_global_branch: true
    use_local_global_fusion: true
    coord_gate_init: -4.0
    refine_gate_init: -4.0
    use_temporal_refine: true
    # Opt-in coordination architecture. Defaults preserve existing LG-FM checkpoints.
    use_dynamic_kinematic_graph: false
    dynamic_graph_layers: 2
    dynamic_graph_topk: 3
    dynamic_graph_timesteps: ${diffusion.timesteps}
    use_contact_balance_state: false
    state_feedback_gain_cap: 1.0
    dynamic_relation_gain_cap: 1.0
    # Preserve learned routing until the highest-noise diffusion region.
    dynamic_relation_static_start_timestep_ratio: 0.75
    graph_residual_gain_cap: 1.0
    use_part_specific_decoder: false
    part_decoder_gate_init: -4.0

  schedule:
    _target_: src.model.schedule.cosine.CosineBetaSchedule
    s: 0.008

  motion_normalizer:
    _target_: src.normalizer.Normalizer
    base_dir: ${run_dir}/motion_stats
    eps: 1e-12

  text_normalizer:
    _target_: src.normalizer.Normalizer
    base_dir: ${run_dir}/text_stats
    eps: 1e-12

  timesteps: 100
  prediction: x

  # learning rate
  lr: 1e-4
